---
# This file is largely based on ⲡⲓⲥⲁϧⲟ's bibliography:
#   https://www.coptist.com/2025/07/30/digitised-bibliography-crum/

# NOTE: Where there is inconsistency in spacing, the stored abbreviated form
# should contain spaces. Our algorithm should then be capable of processing
# space variants.
# For example, storing 'Cai Copt Mus' as a variant results in our algorithm
# generating the following variants for the entry:
# - 'Cai Copt Mus'
# - 'CaiCopt Mus'
# - 'Cai CoptMus'
# - 'CaiCoptMus'
# Storing both 'Cai Copt Mus' and 'CaiCoptMus' would be considered an error,
# because the former implicitly includes the latter, and redundancy is
# forbidden.

# NOTE: Notice the following regarding the structure of the file:
# 1. Use consistent indentation.
# 2. The `title`, `description`, and `variants` fields are required for each
#    entry. The first two can be left empty, but `variants` must have at least
#    one item.
# 3. `title` is a scalar. The data can follow on the same line.
# 4. `description` is a list. The `description:` key must reside on its own line,
#    and each item in the description must follow on a line starting with `- ` (a
#    hyphen followed by a space).
# 5. Use Markdown syntax, specifically:
#    - Single asterisks for emphasis (italic text):
#        *italicized*
#    - Double asterisks for bold text (rendered as `<strong>`):
#        **bold**
#      Use double asterisks exclusively for abbreviations, postfixes, or
#      suffixes that occur within a description (e.g. the volume numbers or
#      sigla a description introduces). Never use them to emphasize ordinary
#      description text.
#    - The bracket notation for hyperlinks:
#        [name](https://example.com/)
# 6. Double-quote all values.
# 7. Don't double-quote any keys (such as `title`, `description`, etc., and
#    postfix keys).
# 8. If a description entry needs to contain a list nested within it, then do
#    the following:
#    - Write `description:` on a separate line.
#    - Begin the entry with `- |-` (a hyphen and a space, followed by a vertical
#      bar and a hyphen).
#    - The description can follow afterwards, on the next indented lines, and it
#      should NOT be surrounded by double quotes.
#    - Use Markdown notation for lists. Each item should be preceded by `- `.
# For all of the above, see examples throughout the files.

# TODO: (#522) Populate missing references, variants, postfixes, descriptions,
# ...etc.

# TODO: (#522) Unify the `papyri.info` citations. They currently disagree on
# the capitalization of the site name (`papyri.info` or `Papyri.info`), and on
# whether the hyperlink sits on the series name or on the site name. The `Tor`
# entry even uses both idioms within a single sentence.

# TODO: (#522) Unify the punctuation of ranges (of pages, volumes, and years).
# The file currently mixes hyphens and en dashes, sometimes within a single
# entry. En dashes are the typographically correct choice.

# TODO: (#522) Drop the `mode/` component from the `archive.org` paths. It
# merely selects a viewer layout (`1up` or `2up`), so it doesn't belong in a
# citation, and it leaves the reader with whichever layout we happened to
# record.

